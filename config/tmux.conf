# Scoped to the dedicated workbench server; never changes the user's default server.
set-window-option -g remain-on-exit on
set-window-option -g mode-keys vi
set-option -g exit-empty on

# Keep wheel events in scrollback instead of sending arrows to provider prompts.
set-option -g mouse on
bind-key -T root WheelUpPane copy-mode -e -t = \; send-keys -X -t = -N 5 scroll-up
bind-key -T root WheelDownPane if-shell -F -t = '#{pane_in_mode}' 'send-keys -X -t = -N 5 scroll-down'
