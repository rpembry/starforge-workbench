# Scoped to the dedicated workbench server; never changes the user's default server.
set-window-option -g remain-on-exit on
set-window-option -g mode-keys vi
set-option -g exit-empty on

# OpenCode manages its own scrollback; other providers use tmux scrollback.
set-option -g mouse on
bind-key -T root WheelUpPane if-shell -F -t = '#{&&:#{==:#{session_name},sfwb-opencode},#{&&:#{mouse_any_flag},#{!:#{pane_in_mode}}}}' 'send-keys -M' 'copy-mode -e -t = ; send-keys -X -t = -N 5 scroll-up'
bind-key -T root WheelDownPane if-shell -F -t = '#{&&:#{==:#{session_name},sfwb-opencode},#{&&:#{mouse_any_flag},#{!:#{pane_in_mode}}}}' 'send-keys -M' "if-shell -F -t = '#{pane_in_mode}' 'send-keys -X -t = -N 5 scroll-down'"
